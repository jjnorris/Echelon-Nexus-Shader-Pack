################################################################################
# ECHELON NEXUS SHADER PACK v2.0
# High-Performance Photorealistic Shaders for Minecraft 1.21.11
#
# Target: Iris 1.6.0+ on Minecraft Java 1.21.11 + NeoForge 1.21.11.38 beta
# Phase: 1 (Foundation - Vanilla Lighting + Library Infrastructure)
# Author: Echelon Nexus Development Team
# License: All Rights Reserved
#
# Configuration Format: Iris/OptiFine .properties
# Documentation: See IMPLEMENTATION_ROADMAP.md for detailed phase breakdown
################################################################################

# ============================================================================
# SHADER PACK METADATA
# ============================================================================

name=Echelon Nexus
description=Fastest, most beautiful, and most efficient photorealistic shader pack
version=2.0.0-phase1

# Target hardware and software
minVersion=120
maxVersion=999

# Game compatibility
profile.0.name=LOW (iGPU Compatible)
profile.0.description=Optimized for Intel iGPU and GTX 1050 (60 FPS target)

profile.1.name=MEDIUM (High Compatibility)
profile.1.description=Optimized for GTX 1660 and RX 6600 (60 FPS target)

profile.2.name=HIGH (Recommended)
profile.2.description=Optimized for RTX 3060 and RX 6700 XT (60 FPS target) [DEFAULT]

profile.3.name=ULTRA (High-End)
profile.3.description=Optimized for RTX 3080 and RX 6800 XT (60+ FPS)

profile.4.name=CINEMA (Maximum Quality)
profile.4.description=Unlimited quality with progressive refinement (30+ FPS)

# ============================================================================
# SAMPLER BINDINGS
# ============================================================================
# These map Minecraft textures and custom samplers to shader units

# Vanilla Minecraft samplers
sampler.colortex0 = RGBA8
sampler.colortex1 = RGBA8
sampler.colortex2 = RGBA8
sampler.colortex3 = RGBA8
sampler.colortex4 = RGB8
sampler.colortex5 = RGB8
sampler.colortex6 = RGB8
sampler.colortex7 = RGB8

# Shadow maps
sampler.shadowtex0 = DEPTH
sampler.shadowtex1 = DEPTH
sampler.shadowcolor0 = RGBA8
sampler.shadowcolor1 = RGBA8

# Depth/Normal targets for deferred rendering (Phase 2+)
sampler.gdepth = DEPTH
sampler.gnormal = RGBA8
sampler.gcolor = RGBA8
sampler.gaux1 = RGBA8

# ============================================================================
# RENDER TARGETS CONFIGURATION
# ============================================================================

# Phase 1: Basic deferred targets
# colortex0: Final lit output
# colortex1: Reserved for Phase 2 (composite2)
# colortex2: Reserved for Phase 3 (TAA history)

# Attachment format specifications
colortex0.format=RGBA8
colortex1.format=RGBA8
colortex2.format=RGBA8

# ============================================================================
# PHASE 1 FEATURE TOGGLES
# ============================================================================
# These control which shader features are active in Phase 1

# Shadow Quality
option.SHADOW_QUALITY=Low Medium High Ultra
value.SHADOW_QUALITY.Low=4
value.SHADOW_QUALITY.Medium=8
value.SHADOW_QUALITY.High=16
value.SHADOW_QUALITY.Ultra=32

screen.phases=<empty> [General Settings]

screen.general=Quality Profiles
desc.general=Select overall quality profile or customize individual settings

# Profile application (set default to HIGH)
screen.quality=Quality Profile
option.PROFILE=Low Medium High Ultra Cinema
value.PROFILE.Low=0
value.PROFILE.Medium=1
value.PROFILE.High=2
value.PROFILE.Ultra=3
value.PROFILE.Cinema=4

# ============================================================================
# PHASE 1 CONFIGURATION SCREENS
# ============================================================================

# Main quality settings
screen.shadow_settings=<empty> [Phase 1: Shadows]
desc.shadow_settings=Basic PCF shadow configuration

option.SHADOW_DISTANCE=0.3 0.4 0.5 0.6 0.7 0.8 0.9 1.0
value.SHADOW_DISTANCE.0.3=0.3
value.SHADOW_DISTANCE.0.4=0.4
value.SHADOW_DISTANCE.0.5=0.5
value.SHADOW_DISTANCE.0.6=0.6
value.SHADOW_DISTANCE.0.7=0.7
value.SHADOW_DISTANCE.0.8=0.8
value.SHADOW_DISTANCE.0.9=0.9
value.SHADOW_DISTANCE.1.0=1.0

# Toggle options
option.BLOCK_LIGHTING=true false
desc.BLOCK_LIGHTING=Enable block light contributions (torches, lava, etc.)

option.AMBIENT_OCCLUSION=true false
desc.AMBIENT_OCCLUSION=Enable vertex-based ambient occlusion darkening

option.BIOME_TINT=true false
desc.BIOME_TINT=Enable biome-specific grass/foliage coloring

# ============================================================================
# PERFORMANCE & OPTIMIZATION
# ============================================================================

# Render distance settings
screen.performance=<empty> [Performance Tuning]
desc.performance=Adjust rendering performance and memory usage

# Frame rate target
option.TARGET_FPS=60 75 120 144
value.TARGET_FPS.60=60
value.TARGET_FPS.75=75
value.TARGET_FPS.120=120
value.TARGET_FPS.144=144

# Resolution scaling (Phase 3+ only, for now disabled)
# option.RESOLUTION_SCALE=100 80 66 50
# value.RESOLUTION_SCALE.100=1.0
# value.RESOLUTION_SCALE.80=0.8
# value.RESOLUTION_SCALE.66=0.67
# value.RESOLUTION_SCALE.50=0.5

# ============================================================================
# DEVELOPMENT & DEBUG OPTIONS
# ============================================================================

screen.debug=<empty> [Debug Settings]
desc.debug=Development tools and visualization modes (development use only)

option.DEBUG_MODE=Off Normals Lighting Depth
value.DEBUG_MODE.Off=0
value.DEBUG_MODE.Normals=1
value.DEBUG_MODE.Lighting=2
value.DEBUG_MODE.Depth=3

option.SHOW_PERFORMANCE=false true
desc.SHOW_PERFORMANCE=Display frame timing information (requires debug build)

# ============================================================================
# QUALITY PROFILE DEFAULTS
# ============================================================================
# These set feature combinations for each profile

# Profile 0: LOW (iGPU/GTX 1050)
SHADOW_QUALITY.profile.0=Low
TARGET_FPS.profile.0=60
BLOCK_LIGHTING.profile.0=false

# Profile 1: MEDIUM (GTX 1660/RX 6600)
SHADOW_QUALITY.profile.1=Medium
TARGET_FPS.profile.1=60
BLOCK_LIGHTING.profile.1=true

# Profile 2: HIGH (RTX 3060/RX 6700 XT) - RECOMMENDED
SHADOW_QUALITY.profile.2=High
TARGET_FPS.profile.2=60
BLOCK_LIGHTING.profile.2=true
AMBIENT_OCCLUSION.profile.2=true
BIOME_TINT.profile.2=true

# Profile 3: ULTRA (RTX 3080/RX 6800 XT)
SHADOW_QUALITY.profile.3=Ultra
TARGET_FPS.profile.3=60
BLOCK_LIGHTING.profile.3=true
AMBIENT_OCCLUSION.profile.3=true
BIOME_TINT.profile.3=true

# Profile 4: CINEMA (RTX 4090/Workstation)
SHADOW_QUALITY.profile.4=Ultra
TARGET_FPS.profile.4=30
BLOCK_LIGHTING.profile.4=true
AMBIENT_OCCLUSION.profile.4=true
BIOME_TINT.profile.4=true

# ============================================================================
# DEFAULT VALUES (GLOBAL)
# ============================================================================

PROFILE=High
SHADOW_QUALITY=High
SHADOW_DISTANCE=0.5
BLOCK_LIGHTING=true
AMBIENT_OCCLUSION=true
BIOME_TINT=true
TARGET_FPS=60
DEBUG_MODE=Off
SHOW_PERFORMANCE=false

# ============================================================================
# IRIS-SPECIFIC FEATURES
# ============================================================================

# Screen space reflection support (Phase 5+)
# When enabled, Iris provides SSR buffers
# sliders.SSR_QUALITY=Screen Space Reflection Quality

# Volumetric lighting (Phase 4+)
# option.VOLUMETRIC_FOG=true false

# Advanced materials (Phase 2+)
# option.LABPBR_MATERIALS=true false

# ============================================================================
# VERSION COMPATIBILITY
# ============================================================================

# Target Minecraft version
supports=1.21.11

# Minimum Iris version
minIrisVersion=1.6.0

# Block entity rendering
blockEntityTypes=shadow

