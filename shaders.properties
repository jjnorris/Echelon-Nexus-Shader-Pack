################################################################################
# ECHELON NEXUS SHADER PACK v2.0 - IRIS CONFIGURATION
################################################################################

name=Echelon Nexus
description=Photorealistic shaders with research-backed techniques
version=2.0.0-phase1

# ============================================================================
# PHASE 1 OPTIONS
# ============================================================================

# Boolean toggle options
option.BLOCK_LIGHTING=true false
option.BIOME_TINT=true false
option.AMBIENT_OCCLUSION=true false

# Multi-value option
option.SHADOW_QUALITY=Low Medium High Ultra
value.SHADOW_QUALITY.Low=0
value.SHADOW_QUALITY.Medium=1
value.SHADOW_QUALITY.High=2
value.SHADOW_QUALITY.Ultra=3

# ============================================================================
# DEFAULT VALUES
# ============================================================================

SHADOW_QUALITY=High
BLOCK_LIGHTING=true
BIOME_TINT=true
AMBIENT_OCCLUSION=true

# ============================================================================
# SCREEN LAYOUT
# ============================================================================

# Main menu with profile selector and sub-screens
screen=<empty> <profile> [SHADOWS] [LIGHTING]

# Shadows sub-screen
screen.SHADOWS=SHADOW_QUALITY

# Lighting sub-screen
screen.LIGHTING=BLOCK_LIGHTING BIOME_TINT AMBIENT_OCCLUSION

# ============================================================================
# QUALITY PROFILES
# ============================================================================

profile.Ultra=SHADOW_QUALITY:3 BLOCK_LIGHTING:true AMBIENT_OCCLUSION:true
profile.High=SHADOW_QUALITY:2 BLOCK_LIGHTING:true AMBIENT_OCCLUSION:true
profile.Medium=SHADOW_QUALITY:1 BLOCK_LIGHTING:false AMBIENT_OCCLUSION:false
profile.Low=SHADOW_QUALITY:0 BLOCK_LIGHTING:false AMBIENT_OCCLUSION:false
