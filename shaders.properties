################################################################################
# ECHELON NEXUS SHADER PACK v2.0 - IRIS CONFIGURATION
# Minecraft 1.21.11 + Iris 1.6.0+
################################################################################

name=Echelon Nexus
description=Photorealistic shaders with research-backed techniques
version=2.0.0-phase1

# ============================================================================
# BASIC SAMPLER SETUP
# ============================================================================

sampler.colortex0=RGBA8
sampler.colortex1=RGBA8
sampler.colortex2=RGBA8
sampler.colortex3=RGBA8
sampler.colortex4=RGB8
sampler.colortex5=RGB8
sampler.colortex6=RGB8
sampler.colortex7=RGB8

sampler.shadowtex0=DEPTH
sampler.shadowtex1=DEPTH
sampler.shadowcolor0=RGBA8
sampler.shadowcolor1=RGBA8

# ============================================================================
# QUALITY SETTINGS
# ============================================================================

# Shadow quality slider
option.SHADOW_QUALITY=Low Medium High Ultra
value.SHADOW_QUALITY.Low=0
value.SHADOW_QUALITY.Medium=1
value.SHADOW_QUALITY.High=2
value.SHADOW_QUALITY.Ultra=3

# Block lighting
option.BLOCK_LIGHTING=true false
option.BIOME_TINT=true false
option.AMBIENT_OCCLUSION=true false

# ============================================================================
# DEFAULT VALUES
# ============================================================================

SHADOW_QUALITY=High
BLOCK_LIGHTING=true
BIOME_TINT=true
AMBIENT_OCCLUSION=true

# ============================================================================
# SCREEN LAYOUT
# ============================================================================

screen.Main=<empty>
screen.Main.comment=Echelon Nexus Shader Pack - Phase 1 Configuration

screen.Shadows=<empty> Shadow Quality
option.SHADOW_QUALITY=<profile> Low Medium High Ultra
desc.SHADOW_QUALITY=Adjust shadow quality and softness

screen.Lighting=<empty> Lighting Effects
option.BLOCK_LIGHTING=Block Light
desc.BLOCK_LIGHTING=Enable contributions from torches, lava, glowstone
option.BIOME_TINT=Biome Tint
desc.BIOME_TINT=Enable biome-specific grass and foliage coloring
option.AMBIENT_OCCLUSION=Ambient Occlusion
desc.AMBIENT_OCCLUSION=Enable vertex-based ambient occlusion darkening
