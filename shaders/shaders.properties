option.MATERIAL_INTERFERENCE=false
option.MATERIAL_INTERFERENCE.comment=\
§6Thin-Film Interference (16A)§r\n\
Optical interference in thin films.\n\
Creates soap bubble & oil slick colors.

option.MATERIAL_IRIDESCENCE=false
option.MATERIAL_IRIDESCENCE.comment=\
§6Iridescence Effects (16B)§r\n\
Wavelength-dependent color shift.\n\
Peacock feathers, butterfly wings, CDs.

option.MATERIAL_DIFFRACTION=false
option.MATERIAL_DIFFRACTION.comment=\
§6Diffraction Gratings (16C)§r\n\
Periodic surface diffraction pattern.\n\
Rainbow spectrum from grooves.

option.MATERIAL_CLEARCOAT=false
option.MATERIAL_CLEARCOAT.comment=\
§6Multi-Layer Clearcoat (16D)§r\n\
Clearcoat + base material layers.\n\
Glossy top + matte/metallic base.

option.MATERIAL_CHROMATIC=false
option.MATERIAL_CHROMATIC.comment=\
§6Chromatic Aberration (16E)§r\n\
Wavelength-dependent refraction.\n\
Color fringing from dispersion.

option.MATERIAL_TYPE=0 1 2 3 4
option.MATERIAL_TYPE.comment=\
§6Primary Material Type§r\n\
0 = Thin-Film  1 = Iridescence  2 = Diffraction\n\
3 = Clearcoat  4 = Chromatic

option.MATERIAL_THICKNESS=200.0
option.MATERIAL_THICKNESS.comment=\
§6Material Feature Thickness§r\n\
For films: nanometers (100-1000)\n\
For gratings: micrometers (1-10)

option.MATERIAL_IOR=1.45
option.MATERIAL_IOR.comment=\
§6Refractive Index§r\n\
1.0 (vacuum) to 2.5 (dense materials)\n\
