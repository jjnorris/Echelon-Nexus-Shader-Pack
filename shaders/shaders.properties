# ===================================================================
# Echelon Nexus Shader Pack - Main Configuration
# ===================================================================

# Pack identification
profile.name=Echelon Nexus
profile.version=0.1.0

# ===================================================================
# BUFFER CONFIGURATION & FORMAT DIRECTIVES
# ===================================================================

# ColorTex buffers (with explicit format definitions)
# See BUFFER_LAYOUT.md for detailed semantics and data flow

# Buffer Format Definitions (Iris directive: image.N=FORMAT)
image.0=RGBA8         # colortex0: Scene color (lit or deferred)
image.1=RGBA16F       # colortex1: Material params (roughness, metallic, emissive)
image.2=RGBA16F       # colortex2: Normal (oct-wrap) + depth
image.3=RGBA16F       # colortex3: TAA history (optional if TAA_ON)
image.4=RGBA16F       # colortex4: SSR intermediate (half-res if SSR_ON && TIER >= 2)
image.5=RGBA16F       # colortex5: Bloom prefilter (quarter-res if BLOOM_ON && TIER >= 3)

# Buffer Size Directives
# Default: screen-sized (1.0, 1.0)
# Half-res: scale 0.5 0.5
# Quarter-res: scale 0.25 0.25

# Tier-specific buffer allocation
# These are conditional on PROFILE selection (implemented in Phase 3)

# LOW tier: minimal buffers
# size.4=0.0 0.0  # Disable SSR
# size.5=0.0 0.0  # Disable bloom

# MEDIUM tier: enable optional buffers
# size.4=0.5 0.5  # SSR at half-res
# size.5=0.0 0.0  # Bloom disabled by default

# HIGH tier: full allocation
# size.4=0.5 0.5  # SSR at half-res
# size.5=0.25 0.25  # Bloom at quarter-res

# ULTRA/CINEMATIC tiers: all buffers enabled
# (size directives use defaults above)

# Note: Actual tier-based sizing will be implemented in Phase 3
# via conditional profile settings and dynamic buffer sizing

# ===================================================================
# PROGRAM ORDERING & CONFIGURATION
# ===================================================================

# Entry points are implicitly ordered by Iris as:
# 1. begin.csh (optional setup compute)
# 2. shadow.vsh/fsh
# 3. gbuffers_* (terrain, entities, hand, weather, water)
# 4. deferred.vsh/fsh
# 5. deferred1.vsh/fsh (optional)
# 6. composite.vsh/fsh
# 7. composite1.vsh/fsh (optional)
# 8. final.vsh/fsh

# Explicit program ordering (optional; use if reordering is needed)
# order.programs=shadow gbuffers_terrain gbuffers_entities gbuffers_hand gbuffers_weather gbuffers_water deferred composite final

# ===================================================================
# FEATURE FLAGS & PROFILE SELECTION
# ===================================================================

# Quality profile selection
screen=<profile>
screen.columns=2

option.PROFILE=LOW MEDIUM HIGH ULTRA CINEMATIC
option.PROFILE.comment=Quality profile (determines all quality parameters)

# TIER-SPECIFIC SETTINGS (locked per profile)
option.TIER=1
option.TIER.comment=Internal tier identifier (set by profile)

# ===================================================================
# RENDERING QUALITY OPTIONS
# ===================================================================

option.PBR_MODE=0 1
option.PBR_MODE.comment=0=LabPBR (preferred), 1=oldPBR (legacy)

option.LABPBR_ON=true
option.LABPBR_ON.comment=Enable LabPBR material decoding

option.OLDPBR_ON=false
option.OLDPBR_ON.comment=Enable oldPBR fallback support

option.PARALLAX_ON=false
option.PARALLAX_ON.comment=Enable parallax/height mapping (enhanced path)

option.PARALLAX_QUALITY=1.0
option.PARALLAX_QUALITY.comment=Parallax sample count scale

# ===================================================================
# SHADOW CONFIGURATION
# ===================================================================

option.SHADOW_QUALITY=0 1 2
option.SHADOW_QUALITY.comment=0=PCF, 1=PCSS, 2=Advanced

option.SHADOW_FILTER_SIZE=1.0
option.SHADOW_FILTER_SIZE.comment=Filter kernel radius multiplier

option.SHADOW_DISTANCE=128
option.SHADOW_DISTANCE.comment=Shadow map render distance (blocks)

option.SHADOW_BIAS=0.001
option.SHADOW_BIAS.comment=Depth bias for shadow acne prevention

# ===================================================================
# LIGHTING OPTIONS (Phase 19-20 Advanced)
# ===================================================================

option.EMISSIVE_RESPONSE=true
option.EMISSIVE_RESPONSE.comment=Enable self-emitted light response

option.TORCH_FLICKER=true
option.TORCH_FLICKER.comment=Enable torch flicker simulation

option.TORCH_FLICKER_SPEED=1.0
option.TORCH_FLICKER_SPEED.comment=Torch flicker frequency multiplier

option.INDIRECT_ON=false
option.INDIRECT_ON.comment=Enable global illumination (indirect lighting)

option.INDIRECT_SAMPLES=4 8 16
option.INDIRECT_SAMPLES.comment=Monte Carlo samples for indirect lighting

option.INDIRECT_BOUNCES=1 2 3
option.INDIRECT_BOUNCES.comment=Light bounce depth for global illumination

option.PATH_CACHING=true
option.PATH_CACHING.comment=Enable temporal path caching for stability

option.INDIRECT_QUALITY=0.5
option.INDIRECT_QUALITY.comment=Indirect lighting quality multiplier

option.IBL_ON=false
option.IBL_ON.comment=Enable image-based lighting

option.IBL_INTENSITY=1.0
option.IBL_INTENSITY.comment=IBL contribution strength

option.REFLECTION_PROBES_ON=false
option.REFLECTION_PROBES_ON.comment=Enable reflection probe system

option.SH_BANDS=1 2 3
option.SH_BANDS.comment=Spherical harmonic band count

option.PROBE_COUNT=0 1 4 16
option.PROBE_COUNT.comment=Number of reflection probes

# ===================================================================
# SSR (SCREEN-SPACE REFLECTIONS)
# ===================================================================

option.SSR_ON=false
option.SSR_ON.comment=Enable screen-space reflections (enhanced path)

option.SSR_QUALITY=1 2 3
option.SSR_QUALITY.comment=1=Stochastic, 2=Hierarchical, 3=High-quality

option.SSR_STEP_COUNT=32
option.SSR_STEP_COUNT.comment=Number of SSR trace steps

option.SSR_HISTORY_CLAMPING=true
option.SSR_HISTORY_CLAMPING.comment=Use variance-aware history clamping

# ===================================================================
# TEMPORAL ANTI-ALIASING (Phase 15+ Advanced)
# ===================================================================

option.TAA_ON=false
option.TAA_ON.comment=Enable temporal anti-aliasing (enhanced path)

option.TAA_QUALITY=0 1 2
option.TAA_QUALITY.comment=0=Halton(2,3), 1=Hammersley, 2=Adaptive+Confidence

option.TAA_JITTER_SCALE=1.0
option.TAA_JITTER_SCALE.comment=TAA subpixel jitter amount

option.TAA_SAMPLE_WEIGHT=0.7
option.TAA_SAMPLE_WEIGHT.comment=Current sample weight for importance blending (0.5-0.95)

option.TAA_SHARPEN=0.5
option.TAA_SHARPEN.comment=TAA sharpening (0=minimal, 1=maximum)

option.TAA_CLAMP_STRENGTH=1.0
option.TAA_CLAMP_STRENGTH.comment=History clamping strength (reduce ghosting)

option.TAA_FILTER_TYPE=0 1 2
option.TAA_FILTER_TYPE.comment=0=Box, 1=Lanczos, 2=Catmull-Rom

option.TAA_ADAPTIVITY=1.0
option.TAA_ADAPTIVITY.comment=Adaptive blending response (0=constant, 1=fully adaptive)

# ===================================================================
# ADVANCED MATERIALS (Phase 16-17)
# ===================================================================

option.INTERFERENCE_ON=false
option.INTERFERENCE_ON.comment=Enable thin-film interference effects

option.INTERFERENCE_STRENGTH=0.5
option.INTERFERENCE_STRENGTH.comment=Interference effect intensity

option.IRIDESCENCE_ON=true
option.IRIDESCENCE_ON.comment=Enable iridescent color shift

option.LAYER_COUNT=1 2 3
option.LAYER_COUNT.comment=Material layer count

option.SPECTRAL_SAMPLES=4 8 16
option.SPECTRAL_SAMPLES.comment=Spectral decomposition samples

option.DIFFRACTION_ON=false
option.DIFFRACTION_ON.comment=Enable diffraction effects

option.SPECTRAL_BLOOM_ON=false
option.SPECTRAL_BLOOM_ON.comment=Enable spectral bloom effect

option.CHROMATIC_ABERRATION=0.0
option.CHROMATIC_ABERRATION.comment=Chromatic aberration amount (0-1)

# ===================================================================
# BLOOM & POST-PROCESSING (Phase 17+)
# ===================================================================

option.BLOOM_ON=false
option.BLOOM_ON.comment=Enable fullscreen bloom (enhanced path)

option.BLOOM_STRENGTH=0.5
option.BLOOM_STRENGTH.comment=Bloom intensity (0=off, 1=maximum)

option.BLOOM_THRESHOLD=0.8
option.BLOOM_THRESHOLD.comment=Bloom brightness threshold

option.BLOOM_QUALITY=0 1
option.BLOOM_QUALITY.comment=0=Half-res, 1=Full-res chain

option.SHARPEN_AMOUNT=0.2
option.SHARPEN_AMOUNT.comment=Unsharp mask strength (0=off)

option.AIRY_DISK_ON=false
option.AIRY_DISK_ON.comment=Enable airy disk diffraction effects

option.LENS_FLARE_ON=false
option.LENS_FLARE_ON.comment=Enable lens flare artifacts

# ===================================================================
# WATER CONFIGURATION (Phase 18+ Advanced)
# ===================================================================

option.WATER_QUALITY=0 1 2
option.WATER_QUALITY.comment=0=Basic, 1=Animated, 2=Advanced+Physics

option.WATER_WAVE_AMPLITUDE=0.5
option.WATER_WAVE_AMPLITUDE.comment=Gerstner wave height multiplier

option.WATER_WAVE_FREQUENCY=1.0
option.WATER_WAVE_FREQUENCY.comment=Wave frequency multiplier

option.CAUSTICS_ON=false
option.CAUSTICS_ON.comment=Enable animated water caustics (premium)

option.CAUSTICS_SPEED=1.0
option.CAUSTICS_SPEED.comment=Caustic animation speed

option.CAUSTICS_SCALE=1.0
option.CAUSTICS_SCALE.comment=Caustic pattern scale

option.WATER_FOAM_INTENSITY=0.7
option.WATER_FOAM_INTENSITY.comment=Foam generation intensity

option.WATER_REFRACTION_STRENGTH=1.0
option.WATER_REFRACTION_STRENGTH.comment=Underwater refraction amount

option.UNDERWATER_SCATTERING=true
option.UNDERWATER_SCATTERING.comment=Enable underwater volumetric scattering

option.FOAM_AT_SHORES=true
option.FOAM_AT_SHORES.comment=Generate foam at shorelines

option.WETNESS_ON=true
option.WETNESS_ON.comment=Enable wetness state modulation of materials

option.RAIN_PUDDLES=true
option.RAIN_PUDDLES.comment=Show rain puddles and wetness effects

# ===================================================================
# VOLUMETRIC FOG & ATMOSPHERE
# ===================================================================

option.VOLUMETRIC_FOG_ON=true
option.VOLUMETRIC_FOG_ON.comment=Enable volumetric-style fog rendering

option.FOG_QUALITY=0 1 2
option.FOG_QUALITY.comment=0=Low, 1=Medium, 2=High

option.AERIAL_PERSPECTIVE_DISTANCE=256
option.AERIAL_PERSPECTIVE_DISTANCE.comment=Aerial perspective fade distance

option.WEATHER_FOG_DENSITY=1.0
option.WEATHER_FOG_DENSITY.comment=Rain fog density multiplier

# ===================================================================
# CLOUD CONFIGURATION
# ===================================================================

option.CLOUDS_ON=true
option.CLOUDS_ON.comment=Enable cloud rendering

option.CLOUD_QUALITY=0 1 2
option.CLOUD_QUALITY.comment=0=Simple, 1=Volumetric, 2=High-quality

option.CLOUD_RAYMARCH_STEPS=16
option.CLOUD_RAYMARCH_STEPS.comment=Number of cloud volumetric steps

option.CLOUD_NOISE_DETAIL=2
option.CLOUD_NOISE_DETAIL.comment=Noise octave count

option.CLOUD_TEMPORAL_STABILITY=true
option.CLOUD_TEMPORAL_STABILITY.comment=Enable temporal filtering on clouds

# ===================================================================
# TONEMAPPING & COLOR GRADING
# ===================================================================

option.TONEMAP_OPERATOR=0 1 2
option.TONEMAP_OPERATOR.comment=0=ACES, 1=Filmic, 2=Reinhard

option.TONEMAP_EXPOSURE=1.0
option.TONEMAP_EXPOSURE.comment=Exposure adjustment (-2.0 to +2.0)

option.COLOR_GRADE_PRESET=0 1 2 3
option.COLOR_GRADE_PRESET.comment=0=Default, 1=Warm, 2=Cool, 3=Saturated

option.COLOR_GRADE_STRENGTH=0.8
option.COLOR_GRADE_STRENGTH.comment=Color grading LUT blend strength

# ===================================================================
# COMPUTE & ADVANCED PATHS (Optional)
# ===================================================================

option.COMPUTE_PATH_ON=false
option.COMPUTE_PATH_ON.comment=Enable compute shader paths (if supported)

option.SSBO_PATH_ON=false
option.SSBO_PATH_ON.comment=Enable SSBO-assisted paths (if supported)

option.ALLOW_CONCURRENT_COMPUTE=false
option.ALLOW_CONCURRENT_COMPUTE.comment=Use Iris concurrent compute (advanced)

# ===================================================================
# DEBUG & DIAGNOSTICS
# ===================================================================

option.DEBUG_VIEW=0 1 2 3 4 5 6 7 8
option.DEBUG_VIEW.comment=0=Off, 1=Normals, 2=Roughness, 3=Metallic, 4=Emissive, 5=Depth, 6=Lighting, 7=History, 8=SSR

option.DEBUG_VIEW_MODE=false
option.DEBUG_VIEW_MODE.comment=Enable debug visualization overlay

option.DEBUG_SHOW_BUFFERS=false
option.DEBUG_SHOW_BUFFERS.comment=Display intermediate buffer contents

# ===================================================================
# PROFILE PRESETS (LOW, MEDIUM, HIGH, ULTRA, CINEMATIC)
# ===================================================================

# Profile: LOW (Integrated GPU / iGPU; 60 FPS target)
# - No SSR, Bloom, TAA
# - Simple clouds (low step count)
# - PCF shadows only
# - No parallax

profile.LOW=\
PROFILE:LOW \
TIER:1 \
SHADOW_QUALITY:0 \
SHADOW_DISTANCE:64 \
SHADOW_FILTER_SIZE:1.0 \
CLOUD_QUALITY:0 \
CLOUD_RAYMARCH_STEPS:8 \
SSR_ON:false \
TAA_ON:false \
BLOOM_ON:false \
PARALLAX_ON:false \
VOLUMETRIC_FOG_ON:true \
FOG_QUALITY:0 \
WATER_QUALITY:0 \
CAUSTICS_ON:false \
WETNESS_ON:true \
TONEMAP_EXPOSURE:1.0 \
COMPUTE_PATH_ON:false

# Profile: MEDIUM (GTX 960 / RX 470; 60 FPS target)
# - PCF/PCSS shadows
# - Volumetric clouds
# - Optional bloom/SSR (disabled by default)
# - No parallax

profile.MEDIUM=\
PROFILE:MEDIUM \
TIER:2 \
SHADOW_QUALITY:0 \
SHADOW_DISTANCE:128 \
SHADOW_FILTER_SIZE:1.5 \
CLOUD_QUALITY:1 \
CLOUD_RAYMARCH_STEPS:16 \
SSR_ON:false \
TAA_ON:false \
BLOOM_ON:false \
PARALLAX_ON:false \
VOLUMETRIC_FOG_ON:true \
FOG_QUALITY:1 \
WATER_QUALITY:1 \
CAUSTICS_ON:false \
WETNESS_ON:true \
TONEMAP_EXPOSURE:1.0 \
COMPUTE_PATH_ON:false

# Profile: HIGH (GTX 1060 / RX 580; 60 FPS target)
# - PCSS shadows
# - High-quality clouds
# - SSR + TAA enabled
# - Optional parallax

profile.HIGH=\
PROFILE:HIGH \
TIER:3 \
SHADOW_QUALITY:1 \
SHADOW_DISTANCE:128 \
SHADOW_FILTER_SIZE:2.0 \
CLOUD_QUALITY:1 \
CLOUD_RAYMARCH_STEPS:24 \
SSR_ON:true \
SSR_QUALITY:1 \
TAA_ON:true \
BLOOM_ON:false \
PARALLAX_ON:false \
VOLUMETRIC_FOG_ON:true \
FOG_QUALITY:2 \
WATER_QUALITY:1 \
CAUSTICS_ON:false \
WETNESS_ON:true \
TONEMAP_EXPOSURE:1.0 \
COMPUTE_PATH_ON:false

# Profile: ULTRA (RTX 2060 / RX 5700 XT; 50+ FPS target)
# - PCSS shadows with advanced filtering
# - High-quality clouds
# - SSR + TAA + Bloom enabled
# - Parallax enabled
# - Compute paths optional

profile.ULTRA=\
PROFILE:ULTRA \
TIER:4 \
SHADOW_QUALITY:1 \
SHADOW_DISTANCE:256 \
SHADOW_FILTER_SIZE:2.5 \
CLOUD_QUALITY:2 \
CLOUD_RAYMARCH_STEPS:32 \
SSR_ON:true \
SSR_QUALITY:2 \
TAA_ON:true \
BLOOM_ON:true \
BLOOM_STRENGTH:0.6 \
PARALLAX_ON:true \
VOLUMETRIC_FOG_ON:true \
FOG_QUALITY:2 \
WATER_QUALITY:2 \
CAUSTICS_ON:true \
WETNESS_ON:true \
TONEMAP_EXPOSURE:1.0 \
COMPUTE_PATH_ON:true

# Profile: CINEMATIC (RTX 4080 / RX 7900 XTX; 30-40 FPS target)
# - All features enabled
# - Maximum quality on all settings
# - Compute + SSBO paths enabled
# - Premium visual fidelity

profile.CINEMATIC=\
PROFILE:CINEMATIC \
TIER:5 \
SHADOW_QUALITY:2 \
SHADOW_DISTANCE:512 \
SHADOW_FILTER_SIZE:3.0 \
CLOUD_QUALITY:2 \
CLOUD_RAYMARCH_STEPS:48 \
SSR_ON:true \
SSR_QUALITY:3 \
TAA_ON:true \
TAA_SHARPEN:0.7 \
BLOOM_ON:true \
BLOOM_STRENGTH:0.8 \
BLOOM_QUALITY:1 \
PARALLAX_ON:true \
PARALLAX_QUALITY:2.0 \
VOLUMETRIC_FOG_ON:true \
FOG_QUALITY:2 \
WATER_QUALITY:2 \
CAUSTICS_ON:true \
WETNESS_ON:true \
TONEMAP_EXPOSURE:1.2 \
COMPUTE_PATH_ON:true \
SSBO_PATH_ON:true

# ===================================================================
# SCREEN ORGANIZATION
# ===================================================================

screen=<quality>
screen.columns=1
screen.PROFILE.comment=Select overall quality profile (LOW to CINEMATIC)

screen=<rendering>
screen.columns=2
screen.PBR_MODE.comment=Material decoding format
screen.SHADOW_QUALITY.comment=Shadow filtering quality
screen.WATER_QUALITY.comment=Water rendering quality
screen.CLOUD_QUALITY.comment=Cloud complexity
screen.FOG_QUALITY.comment=Atmospheric fog detail

screen=<effects>
screen.columns=2
screen.SSR_ON.comment=Screen-space reflections
screen.TAA_ON.comment=Temporal anti-aliasing
screen.BLOOM_ON.comment=Fullscreen bloom
screen.PARALLAX_ON.comment=Height-based parallax mapping
screen.CAUSTICS_ON.comment=Water caustics animation
screen.WETNESS_ON.comment=Wetness material response

screen=<tonemap>
screen.columns=2
screen.TONEMAP_OPERATOR.comment=Tonemapping algorithm
screen.COLOR_GRADE_PRESET.comment=Color grading preset
screen.TONEMAP_EXPOSURE.comment=Exposure adjustment

screen=<advanced>
screen.columns=1
screen.COMPUTE_PATH_ON.comment=Use compute shaders (optional, if supported)
screen.SSBO_PATH_ON.comment=Use SSBO acceleration (optional, if supported)
screen.DEBUG_VIEW_MODE.comment=Enable debug visualization

# ===================================================================
# DEFAULT PROFILE
# ===================================================================

defaultProfile=MEDIUM

# ===================================================================
# END OF CONFIGURATION
# ===================================================================
