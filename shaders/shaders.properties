option.EFFECT_CAUSTICS.comment=\
§6Caustics (17A)§r\n\
Water light refraction patterns.\n\
Creates dancing lights on surfaces.

option.EFFECT_SPECTRAL_BLOOM=false
option.EFFECT_SPECTRAL_BLOOM.comment=\
