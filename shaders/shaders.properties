option.MATERIAL_ABBE=40.0
option.MATERIAL_ABBE.comment=\
§6Abbe Number (Dispersion)§r\n\
Higher = less dispersion (clear glass)\n\
Lower = more dispersion (colored glass)

# ╔═══════════════════════════════════════════════════════════════════════════╗
