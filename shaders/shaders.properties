# Echelon Nexus - Minimal Fresh Foundation
profile.name=Echelon Nexus
profile.version=2.0.0-fresh

# Buffer format specification
# colortex0: Final scene color (where G-buffers write, and deferred reads/writes)
image.0=RGBA8

# Optional buffers for future features
image.1=RGBA16F
image.2=RGBA16F
image.3=RGBA16F

# Shader program ordering (implicit, but can be explicit if needed)
# 1. gbuffers_* passes render to colortex0
# 2. deferred reads colortex0, writes back to colortex0
# 3. composite/composite1 read/write colortex0
# 4. final reads colortex0, outputs to screen

# Screen resolution
screen=

# No options yet - we're at the bare minimum
