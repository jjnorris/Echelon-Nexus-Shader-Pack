# Echelon Nexus Shader Pack - Phase 1
# Iris 1.19.6 + Minecraft 1.21.11 + NeoForge

# Force video settings for correct rendering
oldHandLight=false
oldLighting=false
separateAo=true
underwaterOverlay=false

# Sampler configuration - CRITICAL for fragment shaders
# Unit 0: gtexture (terrain/entity texture)
# Unit 1: lightmap (vanilla lightmap)
sampler.0=gtexture
sampler.1=lightmap

# Alpha test configuration for cutout blocks
alphaTest.gbuffers_terrain=GREATER 0.1
alphaTest.gbuffers_textured=GREATER 0.1
alphaTest.gbuffers_water=GREATER 0.0
alphaTest.gbuffers_entities=GREATER 0.1
alphaTest.gbuffers_hand=GREATER 0.1
alphaTest.gbuffers_skytextured=GREATER 0.1
