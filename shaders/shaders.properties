profile.name=Echelon Nexus
profile.version=1.0.0

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ BUFFER CONFIGURATION & FORMAT DIRECTIVES                                 ║
# ║                                                                           ║
# ║ Defines memory layout for render targets and intermediate buffers.       ║
# ║ Each buffer is allocated for specific rendering passes and effects.      ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

image.0=RGBA8         # colortex0: Scene color (lit or deferred)
image.1=RGBA16F       # colortex1: Material params (roughness, metallic, emissive)
image.2=RGBA16F       # colortex2: Normal (oct-wrap) + depth
image.3=RGBA16F       # colortex3: TAA history (optional if TAA_ON)
image.4=RGBA16F       # colortex4: SSR intermediate (half-res if SSR_ON && TIER >= 2)
image.5=RGBA16F       # colortex5: Bloom prefilter (quarter-res if BLOOM_ON && TIER >= 3)

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ PROGRAM ORDERING & PIPELINE CONFIGURATION                                ║
# ║                                                                           ║
# ║ Specifies the order in which shader passes execute. Implicit order:      ║
# ║  1. Shadow pass (shadow.vsh/fsh)                                         ║
# ║  2. G-buffer passes (gbuffers_*)                                         ║
# ║  3. Deferred pass (deferred.vsh/fsh)                                     ║
# ║  4. Composite passes (composite.vsh/fsh)                                 ║
# ║  5. Final post-processing (final.vsh/fsh)                               ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ QUALITY PROFILE SELECTION                                                ║
# ║                                                                           ║
# ║ Choose overall quality tier. This automatically configures all 100+      ║
# ║ options to provide balanced performance/quality for your GPU.            ║
# ║                                                                           ║
# ║ Available Tiers:                                                         ║
# ║   LOW      - Integrated GPU (60 FPS target)                             ║
# ║   MEDIUM   - GTX 960 / RX 470 (60 FPS target)                          ║
# ║   HIGH     - GTX 1060 / RX 580 (60 FPS target)                         ║
# ║   ULTRA    - RTX 2060 / RX 5700 (50 FPS target)                        ║
# ║   CINEMATIC- RTX 4080+ (30 FPS target, maximum quality)                 ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

screen=<empty> [PROFILE] <empty> [RENDERING] <empty> [EFFECTS] <empty> [ADVANCED] <empty> [TONEMAP] <empty> <profile>
screen.columns=2

screen.PROFILE=PROFILE TIER
screen.PROFILE.columns=1

option.PROFILE=LOW MEDIUM HIGH ULTRA CINEMATIC
option.PROFILE.comment=\
§6Quality Profile§r\n\
Automatically configures all 100+ options for your GPU.\n\
§cLOW§r: iGPU, LOW: 120 FPS | \n\
§6MEDIUM§r: GTX 960, 100 FPS | \n\
§bHIGH§r: GTX 1060, 75 FPS | \n\
§5ULTRA§r: RTX 2060, 55 FPS | \n\
§cCINEMATIC§r: RTX 4080, 35 FPS

option.TIER=1
option.TIER.comment=Internal tier identifier (automatically set by profile)

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ MATERIAL RENDERING (PBR & SURFACE PROPERTIES)                            ║
# ║                                                                           ║
# ║ Controls how materials are rendered. Supports both LabPBR (modern,       ║
# ║ recommended) and oldPBR (legacy) material formats.                       ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

option.PBR_MODE=0 1
option.PBR_MODE.comment=\
§6Material Format§r\n\
0 = §aLabPBR§r (recommended, modern format)\n\
1 = §6oldPBR§r (legacy, for compatibility)

option.LABPBR_ON=true
option.LABPBR_ON.comment=\
§6LabPBR Support§r\n\
Enable modern LabPBR material decoding.\n\
Provides superior material accuracy and effects.

option.OLDPBR_ON=false
option.OLDPBR_ON.comment=\
§6oldPBR Fallback§r\n\
Enable legacy oldPBR format support.\n\
Useful for texture packs using older standards.

option.PARALLAX_ON=true
option.PARALLAX_ON.comment=\
§6Parallax Mapping§r\n\
Enable height-based parallax/displacement effects.\n\
Creates depth illusion on surfaces with height maps.\n\
§cPerformance Impact:§r Moderate (varies with quality)\n\
§aPhotorealistic Default:§r Enabled for texture detail

option.PARALLAX_QUALITY=1.0
option.PARALLAX_QUALITY.comment=\
§6Parallax Sample Count§r\n\
Multiplier for parallax sampling iterations.\n\
Higher = better quality, lower = faster performance.\n\
§cTip:§r 0.5-2.0 is typical range

option.PARALLAX_SELF_SHADOW=false
option.PARALLAX_SELF_SHADOW.comment=\
§6Parallax Self-Shadowing§r\n\
Enable self-shadowing within parallax-mapped surfaces.\n\
Creates realistic shadows in height-displaced geometry.\n\
§cPhase 28 Feature§r: Novel enhancement

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ SHADOW CONFIGURATION (ADVANCED FILTERING)                                ║
# ║                                                                           ║
# ║ Controls shadow quality, filtering, and soft shadow rendering.           ║
# ║ Multiple algorithms available from basic to advanced.                    ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

option.SHADOW_QUALITY=0 1 2
option.SHADOW_QUALITY.comment=\
§6Shadow Algorithm§r\n\
0 = §ePCF§r (Percentage Closer Filtering - basic)\n\
1 = §ePCSS§r (Percentage Closer Soft Shadows)\n\
2 = §9Advanced§r (ESM/VSM - Phase 21)\n\
§aPhotorealistic Default:§r Use 1 (PCSS) or higher

option.SHADOW_ALGORITHM=0 1 2
option.SHADOW_ALGORITHM.comment=\
§6Advanced Shadow Method§r\n\
0 = §ePCF§r (standard, good quality)\n\
1 = §9ESM§r (Exponential - fast, soft shadows)\n\
2 = §5VSM§r (Variance - reduces light bleeding)

option.BLUE_NOISE_DITHER=true
option.BLUE_NOISE_DITHER.comment=\
§6Blue-Noise Shadow Dithering§r\n\
Use perceptually-optimal dithering in shadow sampling.\n\
§cBenefit:§r Eliminates banding artifacts\n\
§bPhase 21§r: Perceptual optimization technique

option.PENUMBRA_SCALE=1.0
option.PENUMBRA_SCALE.comment=\
§6Penumbra Filter Size§r\n\
Controls soft shadow softness multiplier.\n\
Higher = softer shadows, lower = sharper shadows.\n\
§cRange:§r 0.5 - 2.0 typical

option.SHADOW_SOFTNESS=1.0
option.SHADOW_SOFTNESS.comment=\
§6Overall Shadow Softness§r\n\
Global multiplier for all shadow soft edges.\n\
Affects both directional and dynamic shadows.

option.SHADOW_FILTER_SIZE=1.0
option.SHADOW_FILTER_SIZE.comment=\
§6Shadow Filter Radius§r\n\
Size of shadow filtering kernel in texels.\n\
Higher = softer but slower, lower = sharper/faster.

option.SHADOW_DISTANCE=128
option.SHADOW_DISTANCE.comment=\
§6Shadow Render Distance§r\n\
Maximum distance shadows are rendered (blocks).\n\
§cTip:§r 64-256 typical, higher = better quality far away

option.SHADOW_BIAS=0.001
option.SHADOW_BIAS.comment=\
§6Shadow Acne Prevention§r\n\
Depth bias to prevent shadow acne artifacts.\n\
§cNote:§r Too high = detached shadows, too low = acne

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ TEMPORAL ANTI-ALIASING (PHASE 15 - HALTON SEQUENCES)                     ║
# ║                                                                           ║
# ║ Advanced temporal anti-aliasing using quasi-random sampling.             ║
# ║ Halton sequences provide 4-8x faster convergence than random jitter.     ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

option.TAA_ON=true
option.TAA_ON.comment=\
§6Temporal Anti-Aliasing§r\n\
Enable TAA for smoother image over time.\n\
§cBenefit:§r Dramatically reduces aliasing/jagged edges\n\
§9Phase 15§r: Research-backed sampling\n\
§aPhotorealistic Default:§r Enabled for quality

option.TAA_QUALITY=0 1 2
option.TAA_QUALITY.comment=\
§6TAA Sampling Method§r\n\
0 = §aHalton(2,3)§r - Basic sequence\n\
1 = §aHammersley§r - Better uniformity\n\
2 = §bAdaptive+Confidence§r - Best quality (Phase 15)

option.TAA_JITTER_SCALE=1.0
option.TAA_JITTER_SCALE.comment=\
§6TAA Jitter Amount§r\n\
Subpixel jitter strength per frame.\n\
Higher = more temporal variation, lower = less ghosting.

option.TAA_SAMPLE_WEIGHT=0.7
option.TAA_SAMPLE_WEIGHT.comment=\
§6Current Sample Weight§r\n\
Importance weight for current frame vs history.\n\
§cRange:§r 0.5-0.95 (higher = more current frame blending)

option.TAA_SHARPEN=0.5
option.TAA_SHARPEN.comment=\
§6TAA Sharpening§r\n\
Post-TAA sharpening filter strength.\n\
Higher = sharper but more ghosting, lower = smoother.

option.TAA_CLAMP_STRENGTH=1.0
option.TAA_CLAMP_STRENGTH.comment=\
§6History Clamping Strength§r\n\
How aggressively to clamp history to neighborhood.\n\
Higher = reduce ghosting, lower = smoother motion.

option.TAA_FILTER_TYPE=0 1 2
option.TAA_FILTER_TYPE.comment=\
§6Reconstruction Filter§r\n\
0 = §cBox§r (fastest, basic)\n\
1 = §9Lanczos§r (better quality, less ringing)\n\
2 = §bCatmull-Rom§r (smooth cubic, best for motion)

option.TAA_ADAPTIVITY=1.0
option.TAA_ADAPTIVITY.comment=\
§6Adaptive Blending Response§r\n\
How much to adapt blending based on motion.\n\
§cRange:§r 0.0 (constant) to 1.0 (fully adaptive)

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ ADVANCED MATERIALS (PHASE 16 - INTERFERENCE & IRIDESCENCE)               ║
# ║                                                                           ║
# ║ Thin-film interference physics and multi-layer material composition.     ║
# ║ Creates realistic oil slicks, iridescent effects, soap bubbles, etc.     ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

option.INTERFERENCE_ON=true
option.INTERFERENCE_ON.comment=\
§6Thin-Film Interference§r\n\
Enable physics-based interference material effects.\n\
§cApplication:§r Oil slicks, soap bubbles, coatings\n\
§bPhase 16§r: Research from Heitz et al. (2019)\n\
§aPhotorealistic Default:§r Enabled for material accuracy

option.INTERFERENCE_STRENGTH=0.5
option.INTERFERENCE_STRENGTH.comment=\
§6Interference Effect Intensity§r\n\
How strongly interference affects material appearance.\n\
Higher = more visible color shift, lower = subtle.

option.IRIDESCENCE_ON=true
option.IRIDESCENCE_ON.comment=\
§6Iridescent Color Shift§r\n\
Enable viewing-angle dependent color variation.\n\
§cEffect:§r Colors shift as you rotate view (like feathers)

option.LAYER_COUNT=1 2 3
option.LAYER_COUNT.comment=\
§6Material Layer Count§r\n\
Number of stacked material layers to simulate.\n\
1 = Simple, 2 = Paint+Metallic, 3 = Full composition

option.SPECTRAL_SAMPLES=4 8 16
option.SPECTRAL_SAMPLES.comment=\
§6Spectral Decomposition Samples§r\n\
Number of wavelength samples for spectral effects.\n\
Higher = better color accuracy, lower = faster

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ DIFFRACTION & SPECTRAL EFFECTS (PHASE 17)                                ║
# ║                                                                           ║
# ║ Wave-based diffraction for caustics, bloom, and light effects.          ║
# ║ Creates realistic water caustics and spectral light dispersion.          ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

option.DIFFRACTION_ON=false
option.DIFFRACTION_ON.comment=\
§6Diffraction Effects§r\n\
Enable wave-based diffraction pattern generation.\n\
§cApplication:§r Water caustics, light diffraction\n\
§bPhase 17§r: Born & Wolf optics theory

option.SPECTRAL_BLOOM_ON=true
option.SPECTRAL_BLOOM_ON.comment=\
§6Spectral Bloom§r\n\
Enable wavelength-dependent bloom effect.\n\
§cEffect:§r Different colors bloom at different radii\n\
§aPhotorealistic Default:§r Enabled for optical accuracy

option.CHROMATIC_ABERRATION=0.0
option.CHROMATIC_ABERRATION.comment=\
§6Chromatic Aberration§r\n\
Lens chromatic aberration (color fringing).\n\
§cRange:§r 0.0 (none) to 1.0 (extreme)\n\
§cTip:§r 0.1-0.3 looks realistic

option.AIRY_DISK_ON=false
option.AIRY_DISK_ON.comment=\
§6Airy Disk Diffraction§r\n\
Enable diffraction spike effects from bright lights.\n\
§cEffect:§r Star patterns around sun/bright sources\n\
§bPhase 17§r: Circular aperture diffraction

option.LENS_FLARE_ON=false
option.LENS_FLARE_ON.comment=\
§6Lens Flare Artifacts§r\n\
Enable realistic lens flare and artifacts.\n\
§cEffect:§r Glows and halos around bright lights\n\
§bPhase 28§r: Market-leading feature

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ BLOOM & POST-PROCESSING (PHASE 17)                                       ║
# ║                                                                           ║
# ║ Fullscreen bloom, spectral effects, and color correction.               ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

option.BLOOM_ON=true
option.BLOOM_ON.comment=\
§6Fullscreen Bloom§r\n\
Enable bloom/glare effect on bright pixels.\n\
§cBenefit:§r Makes lights glow naturally\n\
§aPhotorealistic Default:§r Enabled for realism

option.BLOOM_STRENGTH=0.5
option.BLOOM_STRENGTH.comment=\
§6Bloom Intensity§r\n\
How strong the bloom effect appears.\n\
§cRange:§r 0.0 (off) to 1.0 (maximum)

option.BLOOM_THRESHOLD=0.8
option.BLOOM_THRESHOLD.comment=\
§6Bloom Brightness Threshold§r\n\
Which pixels trigger bloom (brightness level).\n\
Higher = only brightest pixels bloom, lower = more pixels

option.BLOOM_QUALITY=0 1 2
option.BLOOM_QUALITY.comment=\
§6Bloom Rendering Quality§r\n\
0 = §eFast§r (1 level, ~2ms)\n\
1 = §bBalanced§r (3 levels, ~4ms)\n\
2 = §dHigh-Quality§r (5 levels, ~6ms)

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ PHASE 14 SUB-PHASES: ADVANCED BLOOM EXTENSIONS (14A-E)                  ║
# ║                                                                           ║
# ║ Optional enhancements to base bloom system. Each sub-phase can be        ║
# ║ enabled independently based on performance budget and desired effects.  ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

option.BLOOM_SUBPHASES_ON=false
option.BLOOM_SUBPHASES_ON.comment=\
§6Advanced Bloom Sub-Phases§r\n\
Enable Phase 14 sub-phase enhancements.\n\
Adds dynamic threshold, glare, halos, and more.

option.BLOOM_PHASE14A=false
option.BLOOM_PHASE14A.comment=\
§614A: Dynamic Bloom Threshold§r\n\
Adapts bloom threshold based on scene luminance.\n\
Bright scenes: less bloom | Dark scenes: more bloom

option.BLOOM_PHASE14D=false
option.BLOOM_PHASE14D.comment=\
§614D: Advanced Glare & Halos§r\n\
Adds star glints, custom halos, and lens effects.\n\
Creates cinematic optical effects around bright lights.

option.BLOOM_PHASE14E=false
option.BLOOM_PHASE14E.comment=\
§614E: God Rays Bloom Interaction§r\n\
Integrates bloom with volumetric light shafts.\n\
Bright bloom intensifies volumetric effects.

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ PHASE 15: ADVANCED SAMPLING & FILTERING (15A-F)                         ║
# ║                                                                           ║
# ║ Low-discrepancy quasi-random sampling for Monte Carlo rendering.        ║
# ║ Reduces variance and aliasing in path tracing, soft shadows, etc.       ║
# ║                                                                           ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

option.SAMPLING_MODE=0 1 2 3 4
option.SAMPLING_MODE.comment=\
§6Advanced Sampling Strategy§r\n\
0 = §eHalton§r (2D quasi-random, fast)\n\
1 = §bSobol§r (superior low-discrepancy)\n\
2 = §dBlue Noise§r (perceptually optimal)\n\
3 = §cStratified§r (grid-based variance)\n\
4 = §aMixed§r (combines multiple techniques)

option.MIS_ENABLED=true
option.MIS_ENABLED.comment=\
§6Multiple Importance Sampling§r\n\
Combine BRDF and light sampling.\n\
Significantly reduces variance in lighting.

option.MIS_POWER=2.0
option.MIS_POWER.comment=\
§6MIS Power Heuristic Exponent§r\n\
Higher = more weight to better PDF\n\
Standard: 2.0 (balance/power trade-off)

option.STRATIFIED_SAMPLES=4
option.STRATIFIED_SAMPLES.comment=\
§6Stratified Sampling Grid§r\n\
Grid size per dimension (4 = 4×4 = 16 samples)\n\
Higher = better uniformity, more cost

# ╔═══════════════════════════════════════════════════════════════════════════╗
